name: V21 LEFT phase chain validation
on:
  push:
    branches: [v21]
    paths:
      - '.github/workflows/v21_phase_chain_validation.yml'
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21
          fetch-depth: 0
      - name: Apply LEFT phase-chain patch
        run: python3 tools/apply_v21_left_startup_homing.py
      - name: Migrate TIM4 ownership contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('tests/test_v13_hardware_regressions.py','tests/test_v15_vescflow_v1isr.py'):
              p=Path(name); s=p.read_text()
              old='LeftEncoder_GetCount(), encoder_a, encoder_b'
              new='LeftEncoder_UpdateAndGetCount(), encoder_a, encoder_b'
              if old not in s: raise SystemExit(f'{name}: old TIM4 contract missing')
              p.write_text(s.replace(old,new))
          PY
      - name: Install validation tools
        run: python3 -m pip install --disable-pip-version-check pytest platformio
      - name: Python regressions
        run: python3 -m pytest -q -W error
      - name: Host C protocol and numeric phase tests
        run: bash tests/run_host_tests.sh
      - name: STM32F103RC target build warning-free
        run: |
          set -o pipefail
          pio run -e esc 2>&1 | tee /tmp/build.log
          if grep -E '(^|: )[Ww]arning:' /tmp/build.log; then exit 1; fi
      - name: Commit only validated release files
        run: |
          rm -rf tests/__pycache__ .pytest_cache
          git checkout origin/v20 -- .pio || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Src tests
          if ! git diff --cached --quiet; then
            git commit -m 'V21: prove left encoder phase before closed loop'
            git push origin HEAD:v21
          fi
