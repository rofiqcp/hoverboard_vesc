name: V21 hardware log 192318 fix

on:
  push:
    branches: [v21]
    paths:
      - '.github/workflows/v21_hwlog_192318_fix.yml'
      - 'tools/apply_v21_hwlog_192318_fix.py'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21
          fetch-depth: 0

      - name: Apply 19:23 hardware regression patch
        run: python3 tools/apply_v21_hwlog_192318_fix.py

      - name: Install validation tools
        run: python3 -m pip install --disable-pip-version-check pytest platformio

      - name: Python regressions warnings-as-errors
        run: python3 -m pytest -q -W error

      - name: Full host C and protocol tests
        run: bash tests/run_host_tests.sh

      - name: Warning-free STM32F103RC build
        run: |
          set -o pipefail
          pio run -e esc 2>&1 | tee /tmp/v21_192318_build.log
          if grep -E '(^|: )[Ww]arning:' /tmp/v21_192318_build.log; then
            echo 'Compiler warning detected; refusing commit.'
            exit 1
          fi

      - name: Verify V20 hot ISR identity
        run: |
          git show origin/v20:Src/motor.c > /tmp/motor_v20.c
          cmp -s /tmp/motor_v20.c Src/motor.c
          echo 'Src/motor.c matches V20 byte-for-byte'

      - name: Keep generated artifacts out of release diff
        run: |
          rm -rf tests/__pycache__ .pytest_cache
          git checkout origin/v20 -- .pio || true

      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Src tools/vesc_full_test.py tests CHANGELOG_V21.md
          if git diff --cached --quiet; then
            echo 'No validated source changes.'
          else
            git commit -m 'V21: restore V20 ISR and fix right position telemetry config'
            git push origin HEAD:v21
          fi
