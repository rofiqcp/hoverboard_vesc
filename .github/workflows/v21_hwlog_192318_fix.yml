name: V21 hardware log 192318 fix

on:
  push:
    branches: [v21]
    paths:
      - '.github/workflows/v21_hwlog_192318_fix.yml'
      - 'tools/apply_v21_hwlog_192318_fix.py'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21
          fetch-depth: 0

      - name: Repair helper bootstrap typo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v21_hwlog_192318_fix.py')
          s=p.read_text()
          bad='# Keep the other V21 protocol corrections (duty sign, config, commissioning, etc.).nv21 = read("Src/vesc_protocol.c")'
          good='# Keep the other V21 protocol corrections (duty sign, config, commissioning, etc.).\nnv21 = read("Src/vesc_protocol.c")'
          if bad not in s:
              raise SystemExit('helper bootstrap typo anchor missing')
          p.write_text(s.replace(bad, good, 1))
          PY

      - name: Apply 19:23 hardware regression patch
        run: python3 tools/apply_v21_hwlog_192318_fix.py

      - name: Migrate superseded regression contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: expected one contract anchor, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          rep('Src/vesc_config_compat.c', '    append_auto(b, (float)c->si_gear_ratio_milli / 1000.0f, &i);', '    /* Canonical VESC default for a legacy zero/uninitialized ratio is direct drive 1.0. */\n    const uint16_t gear_ratio_milli = c->si_gear_ratio_milli != 0U ? c->si_gear_ratio_milli : 1000U;\n    append_auto(b, (float)gear_ratio_milli / 1000.0f, &i);')
          rep('tests/test_v14_post_detect_arm_contract.py', "'side_local_feedback': 'prearm_feedback_not_ready(mode, requested_target, cfg, sample, encoder_aligned)' in runtime and '(mode == ESC_MODE_DUTY && target == 0)' in runtime,", "'side_local_feedback': 'prearm_feedback_not_ready(mode, requested_target, cfg, sample, encoder_aligned)' in runtime and '(mode == ESC_MODE_DUTY && target == 0)' not in runtime and 'mode == ESC_MODE_OPEN || mode == ESC_MODE_HANDBRAKE' in runtime,")
          rep('tests/test_resource_contract.py', "assert 'VESC_CURRENT_HOLD_MAX_MS 100U' in protocol", "assert 'VESC_CURRENT_HOLD_MAX_MS 25U' in protocol")
          rep('tests/test_v18_rpm_current_brake_contract.py', "assert 'speed_q4 > -32 && speed_q4 < 32' in foc_c\nassert 'speed_q4 < 0 ? mag : (int16_t)-mag' in foc_c", "assert 'if (speed_q4 < 0) iq_target = mag;' in foc_c\nassert 'else if (speed_q4 > 0) iq_target = (int16_t)-mag;' in foc_c\nassert 'else iq_target = 0;' in foc_c\nassert 'speed_q4 > -32 && speed_q4 < 32' not in foc_c")
          rep('tests/test_v19_integrated_position_sync_home.py', 'assert "NB_OF_VAR             ((uint8_t)158U)" in eeprom_h', 'assert "NB_OF_VAR             ((uint8_t)162U)" in eeprom_h')
          rep('tests/test_v19_integrated_position_sync_home.py', 'for token in ("C_SET_DETECT=11", "C_ROTOR_POSITION=22", "rotor_position_stream_service",\n              ">=10U", "display_position_mode_left=0U", "display_position_mode_right=0U"):\n    assert token in proto', 'for token in ("C_SET_DETECT=11", "C_ROTOR_POSITION=22", "rotor_position_stream_service",\n              ">=10U", "display_position_mode_left=mode", "display_position_mode_right=mode"):\n    assert token in proto\nassert "if(mode!=0U)display_position_mode_left=0U" not in proto\nassert "if(mode!=0U)display_position_mode_right=0U" not in proto')
          rep('tests/test_v21_regressions.py', 'def test_brake_zero_speed_deadband_present():\n    f = src("Src/foc_motor.c")\n    assert "speed_q4 > -32 && speed_q4 < 32" in f', 'def test_brake_uses_standard_speed_opposition_without_v21_deadband():\n    f = src("Src/foc_motor.c")\n    assert "speed_q4 > -32 && speed_q4 < 32" not in f\n    assert "if (speed_q4 < 0) iq_target = mag;" in f\n    assert "else if (speed_q4 > 0) iq_target = (int16_t)-mag;" in f')
          rep('tests/test_v21_regressions.py', 'def test_realtime_steady_sample_not_cleared_on_one_invalid_window():\n    p = src("Src/vesc_protocol.c")\n    assert "VESC_CURRENT_HOLD_MAX_MS 100U" in p\n    assert "temporarily unavailable" in p', 'def test_realtime_current_validity_uses_proven_v20_window():\n    p = src("Src/vesc_protocol.c")\n    assert "VESC_CURRENT_HOLD_MAX_MS 25U" in p\n    assert "MotorControl_CurrentMeasurementValid(left)" in p')
          rep('tests/test_vesc_advanced.c', '    c.p_pid_kp_q16 = q16(1.0);\n    c.p_pid_ki_q16 = q16(1.0);', '    c.p_pid_kp_q16 = q16(1.0);\n    c.p_pid_ki_q16 = q16(1.0);\n    c.p_pid_gain_dec_ticks = 0U; /* isolate saturation/anti-windup behavior */')
          obsolete=Path('tests/test_v21_dual_motor_runtime.py')
          if obsolete.exists(): obsolete.unlink()
          PY

      - name: Install validation tools
        run: python3 -m pip install --disable-pip-version-check pytest platformio

      - name: Python regressions warnings-as-errors
        run: python3 -m pytest -q -W error

      - name: Full host C and protocol tests
        run: bash tests/run_host_tests.sh

      - name: Warning-free STM32F103RC build
        run: |
          set -o pipefail
          pio run -e esc 2>&1 | tee /tmp/v21_192318_build.log
          if grep -E '(^|: )[Ww]arning:' /tmp/v21_192318_build.log; then
            echo 'Compiler warning detected; refusing commit.'
            exit 1
          fi

      - name: Verify V20 hot ISR identity
        run: |
          git show origin/v20:Src/motor.c > /tmp/motor_v20.c
          cmp -s /tmp/motor_v20.c Src/motor.c
          echo 'Src/motor.c matches V20 byte-for-byte'

      - name: Keep generated artifacts out of release diff
        run: |
          rm -rf tests/__pycache__ .pytest_cache
          git checkout origin/v20 -- .pio || true

      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Src tools/vesc_full_test.py tests CHANGELOG_V21.md
          if git diff --cached --quiet; then
            echo 'No validated source changes.'
          else
            git commit -m 'V21: restore V20 ISR and fix right position telemetry config'
            git push origin HEAD:v21
          fi
