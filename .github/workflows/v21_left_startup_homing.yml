name: V21 left startup homing
on:
  push:
    branches: [v21]
    paths:
      - '.github/workflows/v21_left_startup_homing.yml'
      - 'tools/apply_v21_left_startup_homing.py'
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21
          fetch-depth: 0
      - name: Apply startup and homing patch
        run: python3 tools/apply_v21_left_startup_homing.py
      - name: Migrate startup alignment contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: expected one anchor, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          rep('tests/test_v14_post_detect_arm_contract.py',
              "    'encoder_alignment_current': 'sensor_cal_set_current_override(encoderAlign.motor, true, forced_angle_q4,' in runtime,",
              "    'encoder_alignment_current': '1.00 A D-axis phase-0 lock' in runtime and 'sensor_cal_set_current_override(encoderAlign.motor, true, 0,' in runtime,")
          p=Path('tests/test_v20_left_position_rotor_vdq_protocol.py'); s=p.read_text()
          old='''assert 'probe_start_count' in runtime and 'probe_delta_counts' in runtime\nassert 'wanted_inverted = encoderAlign.probe_delta_counts < 0 ? 1U : 0U' in runtime\nassert '/* +120 deg electrical */' in runtime\nassert 'encoderAlign.motor == ESC_MOTOR_LEFT && !encoderAlign.direction_proved' in runtime'''
          new='''# Boot sync must not re-learn direction at a steering hard-stop. Direction/ratio\n# are commissioning proof; boot only performs a current-regulated phase-0 lock.\nassert '1.00 A D-axis phase-0 lock' in runtime\na=runtime.index('static int16_t encoder_alignment_target_current')\nb=runtime.index('static void Homing_SetDefaults', a)\nboot=runtime[a:b]\nassert 'wanted_inverted' not in boot and '+120 deg electrical' not in boot\nassert 'MotorSensor_SyncEncoderElectricalPhase(state, 0U)' in boot'''
          if s.count(old)!=1: raise SystemExit('v20 startup proof block')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install tools
        run: python3 -m pip install --disable-pip-version-check pytest platformio
      - name: Python regressions
        run: python3 -m pytest -q -W error
      - name: Host C and protocol tests
        run: bash tests/run_host_tests.sh
      - name: STM32F103RC build warning-free
        run: |
          set -o pipefail
          pio run -e esc 2>&1 | tee /tmp/build.log
          if grep -E '(^|: )[Ww]arning:' /tmp/build.log; then exit 1; fi
      - name: Commit validated source
        run: |
          rm -rf tests/__pycache__ .pytest_cache
          git checkout origin/v20 -- .pio || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Src tools/vesc_full_test.py tests CHANGELOG_V21.md
          if ! git diff --cached --quiet; then
            git commit -m 'V21: align left phase at boot and calibrate steering span'
            git push origin HEAD:v21
          fi
