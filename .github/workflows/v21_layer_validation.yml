name: V21 layer validation
on:
  push:
    branches: [v21]
    paths:
      - '.github/workflows/v21_layer_validation.yml'
      - 'tools/apply_v21_left_startup_homing.py'
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21
          fetch-depth: 0
      - name: Restore validated test fixture
        run: git checkout 6a43606b9a34d8df5ce0b826dc77e1d725f2df72 -- tests/test_v14_post_detect_arm_contract.py
      - name: Apply source layer
        run: python3 tools/apply_v21_left_startup_homing.py
      - name: Install validation tools
        run: python3 -m pip install --disable-pip-version-check pytest platformio
      - name: Python regressions
        run: python3 -m pytest -q -W error
      - name: Host C and protocol tests
        run: bash tests/run_host_tests.sh
      - name: Target build
        run: |
          set -o pipefail
          pio run -e esc 2>&1 | tee /tmp/build.log
          if grep -E '(^|: )[Ww]arning:' /tmp/build.log; then exit 1; fi
      - name: Commit validated source
        run: |
          rm -rf tests/__pycache__ .pytest_cache
          git checkout origin/v20 -- .pio || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Src tools/vesc_full_test.py tests CHANGELOG_V21.md
          if ! git diff --cached --quiet; then
            git commit -m 'V21: validate corrected output mapping'
            git push origin HEAD:v21
          fi
