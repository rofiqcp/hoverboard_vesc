name: V21 regression patch

on:
  push:
    branches: [v21]
    paths:
      - '.github/workflows/v21_patch.yml'
      - 'tools/apply_v21_patch.py'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21
          fetch-depth: 0

      - name: Apply V21 patch
        run: |
          # RuntimeSettings_Load uses local mc_configuration candidates named
          # 'left' and 'right'. Keep the patch driver explicit but correct for
          # this V20 snapshot before executing it.
          sed -i 's/conf_left\.si_gear_ratio_milli/left.si_gear_ratio_milli/g; s/conf_right\.si_gear_ratio_milli/right.si_gear_ratio_milli/g' tools/apply_v21_patch.py
          python3 tools/apply_v21_patch.py

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Python regression suite
        run: python3 -m pytest -q

      - name: Install PlatformIO
        run: python3 -m pip install --disable-pip-version-check platformio

      - name: Build STM32F103RC firmware
        run: pio run -e esc

      - name: Commit generated V21 source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Src tests CHANGELOG_V21.md tools/apply_v21_patch.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'V21: fix telemetry, encoder detect, config and braking'
            git push origin HEAD:v21
          fi
