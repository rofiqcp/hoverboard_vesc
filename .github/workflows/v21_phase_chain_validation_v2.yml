name: V21 LEFT phase proof validation v2
on:
  push:
    branches: [v21]
    paths:
      - '.github/workflows/v21_phase_chain_validation_v2.yml'
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21
          fetch-depth: 0
      - name: Apply LEFT phase-chain patch
        run: python3 tools/apply_v21_left_startup_homing.py
      - name: Migrate phase-chain contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('tests/test_v13_hardware_regressions.py','tests/test_v15_vescflow_v1isr.py'):
              p=Path(name); s=p.read_text(); old='LeftEncoder_GetCount(), encoder_a, encoder_b'; new='LeftEncoder_UpdateAndGetCount(), encoder_a, encoder_b'
              if old not in s: raise SystemExit(f'{name}: old TIM4 contract missing')
              p.write_text(s.replace(old,new))

          p=Path('tests/test_v21_left_phase_chain.py'); s=p.read_text()
          old="assert 'TIM4->CNT' not in snap and 'previous_cnt' not in snap and 'return accumulated' in snap"
          new="assert 'const uint16_t now = (uint16_t)TIM4->CNT;' not in snap and 'previous_cnt = now' not in snap and 'return accumulated' in snap"
          if old not in s: raise SystemExit('phase-chain passive snapshot assertion missing')
          p.write_text(s.replace(old,new))

          p=Path('tests/test_v21_left_startup_homing_205320.py'); s=p.read_text()
          old='''def test_boot_sync_is_static_one_amp_no_direction_relearn():\n r=s("Src/runtime_control.c")\n a=r.index("static int16_t encoder_alignment_target_current")\n b=r.index("static void Homing_SetDefaults",a)\n block=r[a:b]\n assert "1.00 A D-axis phase-0 lock" in block\n assert "+120" not in block and "probe_delta_counts" not in block\n assert "MotorSensor_SyncEncoderElectricalPhase(state, 0U)" in block\n assert "RuntimeSettings_Save" not in block'''
          new='''def test_boot_sync_proves_phase_before_accepting_zero():\n r=s("Src/runtime_control.c")\n a=r.index("static int16_t encoder_alignment_target_current")\n b=r.index("static void Homing_SetDefaults",a)\n block=r[a:b]\n assert "1.00 A D-axis phase-0 lock" in block\n assert "SENSOR_CAL_ENCODER_PROBE_Q4" in block and "probe_delta_counts" in block\n assert "encoder_alignment_probe_matches" in block\n assert "encoderAlign.probe_direction = -1" in block\n assert "MotorSensor_SyncEncoderElectricalPhase(state, 0U)" in block\n assert block.index("direction_proved") < block.rindex("MotorSensor_SyncEncoderElectricalPhase(state, 0U)")\n assert "RuntimeSettings_Save" not in block'''
          if old not in s: raise SystemExit('old static startup sync contract missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Install validation tools
        run: python3 -m pip install --disable-pip-version-check pytest platformio
      - name: Python regressions
        run: python3 -m pytest -q -W error
      - name: Host C protocol and numeric phase tests
        run: bash tests/run_host_tests.sh
      - name: STM32F103RC target build warning-free
        run: |
          set -o pipefail
          pio run -e esc 2>&1 | tee /tmp/build.log
          if grep -E '(^|: )[Ww]arning:' /tmp/build.log; then exit 1; fi
      - name: Commit only validated release files
        run: |
          rm -rf tests/__pycache__ .pytest_cache
          git checkout origin/v20 -- .pio || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Src tests
          if ! git diff --cached --quiet; then
            git commit -m 'V21: prove left encoder phase before closed loop'
            git push origin HEAD:v21
          fi
