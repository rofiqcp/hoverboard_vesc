name: V21 low speed brake fix

on:
  push:
    branches: [v21]
    paths:
      - '.github/workflows/v21_low_speed_brake_fix.yml'
      - 'tools/apply_v21_low_speed_brake_fix.py'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21
          fetch-depth: 0

      - name: Apply low-speed current-brake patch
        run: python3 tools/apply_v21_low_speed_brake_fix.py

      - name: Install validation tools
        run: python3 -m pip install --disable-pip-version-check pytest platformio

      - name: Regression suite warning-clean
        run: python3 -m pytest -q -W error

      - name: Warning-free STM32F103RC build
        run: |
          set -o pipefail
          pio run -e esc 2>&1 | tee /tmp/v21_low_speed_brake.log
          if grep -E '(^|: )[Ww]arning:' /tmp/v21_low_speed_brake.log; then
            echo 'Compiler warning detected; refusing low-speed brake commit.'
            exit 1
          fi

      - name: Keep generated artifacts out of release diff
        run: |
          rm -rf tests/__pycache__ .pytest_cache
          git checkout origin/v20 -- .pio || true

      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Src tests CHANGELOG_V21.md
          if git diff --cached --quiet; then
            echo 'No validated source changes.'
          else
            git commit -m 'V21: match VESC low-speed brake short'
            git push origin HEAD:v21
          fi
