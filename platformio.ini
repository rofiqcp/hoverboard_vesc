; Firmware tunggal: STM32F103RC board variant 0 + USART3 PB10/PB11
[platformio]
include_dir  = Src
src_dir      = Src
default_envs = esc

[env:esc]
; esc_protocol_compat.c retains only historical CRC/types compatibility.
; USART3 runtime transport is exclusively VESC protocol.
platform        = ststm32
framework       = stm32cube
board           = genericSTM32F103RC
debug_tool      = stlink
upload_protocol = stlink
monitor_speed   = 115200

; Target menambah decoder sensor/runtime pada ISR 16 kHz. Pilih optimasi waktu
; eksekusi; flash masih jauh di bawah batas 256 KB.
build_unflags =
    -Os

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xE
    -O2
    -T./STM32F103RCTx_FLASH.ld
    -lc
    -lm
    -g
    -ggdb
